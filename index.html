<!-- =========================================================
     AMAN ONLINE CENTRE
     PROFESSIONAL MULTI EXAM MOCK TEST SYSTEM
========================================================= -->

<style>

/* =========================
   MOCK TEST LIBRARY
========================= */

.mock-system{
    padding:60px 0;
    background:linear-gradient(180deg,#f5f9ff,#eaf3ff);
}

.mock-container{
    width:92%;
    max-width:1200px;
    margin:auto;
}

.mock-heading{
    text-align:center;
    margin-bottom:30px;
}

.mock-heading h2{
    color:#0755ad;
    font-size:34px;
    margin-bottom:5px;
}

.mock-heading p{
    color:#667085;
}

/* SEARCH */

.exam-search{
    max-width:650px;
    margin:0 auto 30px;
}

.exam-search input{
    width:100%;
    padding:15px 20px;
    border-radius:30px;
    border:2px solid #d9e5f4;
    background:white;
    font-size:16px;
    outline:none;
}

.exam-search input:focus{
    border-color:#0874d8;
}

/* EXAM CARDS */

.exam-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.exam-card{
    background:white;
    border-radius:16px;
    padding:22px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
    border-top:4px solid #0874d8;
    transition:.3s;
}

.exam-card:hover{
    transform:translateY(-5px);
    box-shadow:0 13px 30px rgba(0,0,0,.12);
}

.exam-icon{
    font-size:42px;
}

.exam-card h3{
    color:#0755ad;
    margin:8px 0;
}

.exam-meta{
    font-size:13px;
    color:#667085;
    margin-bottom:15px;
}

.exam-buttons{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.exam-buttons button,
.exam-buttons a{
    border:none;
    border-radius:8px;
    padding:11px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;
}

.start-exam{
    background:#0874d8;
    color:white;
}

.view-pdf{
    background:#eef5ff;
    color:#0755ad;
}

.download-pdf{
    background:#16a34a;
    color:white;
}


/* =========================
   TEST SCREEN
========================= */

.test-screen{
    display:none;
    max-width:950px;
    margin:30px auto 0;
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 12px 35px rgba(0,0,0,.12);
}

.test-header{
    background:linear-gradient(135deg,#063b78,#0874d8);
    color:white;
    padding:22px;
    text-align:center;
}

.test-header h2{
    margin-bottom:4px;
}

.test-start{
    padding:35px;
    text-align:center;
}

.test-start input{
    width:100%;
    max-width:450px;
    padding:14px;
    border:2px solid #dbe5ef;
    border-radius:9px;
    font-size:16px;
    margin:18px 0;
}

.begin-btn{
    border:none;
    background:#0874d8;
    color:white;
    padding:13px 30px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
}

.close-test{
    margin-left:8px;
    border:none;
    background:#e7eaf0;
    padding:13px 22px;
    border-radius:25px;
    cursor:pointer;
}


/* QUESTION AREA */

.question-area{
    display:none;
    padding:25px;
}

.exam-info{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    padding:13px 15px;
    background:#eef5ff;
    border-radius:9px;
    margin-bottom:18px;
    font-weight:bold;
}

.exam-timer{
    color:#d92d20;
}

.progress-bg{
    width:100%;
    height:7px;
    background:#e5e7eb;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:20px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#0874d8,#16a34a);
}

.question-card{
    padding:22px;
    background:#fafcff;
    border:1px solid #e2e8f0;
    border-radius:12px;
}

.question-no{
    color:#0874d8;
    font-weight:bold;
    margin-bottom:7px;
}

.question-text{
    font-size:19px;
    font-weight:bold;
    margin-bottom:17px;
}

.answer-option{
    display:block;
    padding:13px;
    border:1px solid #dbe4ee;
    border-radius:9px;
    margin:9px 0;
    cursor:pointer;
    background:white;
}

.answer-option:hover{
    background:#eef6ff;
    border-color:#0874d8;
}

.answer-option input{
    margin-right:8px;
}

/* NAVIGATION */

.test-navigation{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:20px;
}

.nav-test-btn{
    border:none;
    border-radius:8px;
    padding:11px 20px;
    font-weight:bold;
    cursor:pointer;
}

.previous-btn{
    background:#e9eef5;
}

.next-btn{
    background:#0874d8;
    color:white;
}

.final-submit{
    background:#16a34a;
    color:white;
}

/* QUESTION PALETTE */

.question-palette{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:22px;
}

.palette-question{
    width:38px;
    height:38px;
    border:none;
    border-radius:7px;
    background:#e9eef5;
    font-weight:bold;
    cursor:pointer;
}

.palette-question.current{
    background:#0874d8;
    color:white;
}

.palette-question.done{
    background:#16a34a;
    color:white;
}


/* =========================
   RESULT
========================= */

.test-result{
    display:none;
    padding:30px;
    text-align:center;
}

.score-circle{
    width:150px;
    height:150px;
    margin:20px auto;
    border-radius:50%;
    background:linear-gradient(135deg,#0755ad,#0c8ee8);
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.score-circle strong{
    font-size:35px;
}

.result-stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin:25px 0;
}

.result-item{
    background:#f3f7fb;
    border-radius:10px;
    padding:15px 5px;
}

.result-item strong{
    display:block;
    font-size:22px;
    color:#0755ad;
}

.answer-review{
    text-align:left;
    margin-top:25px;
}

.review-question{
    padding:15px;
    margin:12px 0;
    background:#f8fafc;
    border-radius:9px;
    border-left:4px solid #0874d8;
}

.restart-test{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:25px;
    background:#0874d8;
    color:white;
    font-weight:bold;
    cursor:pointer;
}


/* MOBILE */

@media(max-width:900px){

.exam-grid{
    grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:600px){

.exam-grid{
    grid-template-columns:1fr;
}

.result-stats{
    grid-template-columns:repeat(2,1fr);
}

.question-area,
.test-start,
.test-result{
    padding:18px;
}

.mock-heading h2{
    font-size:27px;
}

}

</style>

pdf:"pdf/banking-01.pdf",

questions:[

{
q:"यदि 5 पेन की कीमत ₹50 है तो एक पेन की कीमत कितनी होगी?",
o:["₹5","₹10","₹15","₹20"],
a:1
},

{
q:"200 का 10 प्रतिशत कितना है?",
o:["10","20","30","40"],
a:1
},

{
q:"2 घंटे 30 मिनट में कितने मिनट होते हैं?",
o:["120","130","150","180"],
a:2
},

{
q:"144 ÷ 12 कितना होगा?",
o:["10","11","12","14"],
a:2
},

{
q:"2, 4, 6, 8 के बाद क्या आएगा?",
o:["9","10","11","12"],
a:1
}

]

}

];


/* =========================================================
   SYSTEM VARIABLES
========================================================= */

let activeExam = null;

let activeQuestion = 0;

let userAnswers = [];

let remainingTime = 0;

let examTimerInterval = null;


/* =========================================================
   CREATE EXAM CARDS AUTOMATICALLY
========================================================= */

function loadExamCards(){

const grid =
document.getElementById("examGrid");

grid.innerHTML="";


examData.forEach(function(exam){

let card =
document.createElement("div");

card.className="exam-card";

card.innerHTML=`

<div class="exam-icon">
${exam.icon}
</div>

<h3>
${exam.name}
</h3>

<div class="exam-meta">
${exam.questions.length} Questions • ${exam.time} Minutes
</div>

<div class="exam-buttons">

<button
class="start-exam"
onclick="selectExam('${exam.id}')">

▶ Start Mock Test

</button>

<a
class="view-pdf"
href="${exam.pdf}"
target="_blank">

📄 View Question PDF

</a>

<a
class="download-pdf"
href="${exam.pdf}"
download>

⬇ Download PDF

</a>

</div>

`;

grid.appendChild(card);

});

}


/* =========================================================
   EXAM SEARCH
========================================================= */

function searchExam(){

let search =
document
.getElementById("examSearch")
.value
.toLowerCase();

document
.querySelectorAll(".exam-card")
.forEach(function(card){

card.style.display =

card.innerText
.toLowerCase()
.includes(search)

?

"block"

:

"none";

});

}


/* =========================================================
   SELECT EXAM
========================================================= */

function selectExam(id){

activeExam =
examData.find(
exam => exam.id === id
);

activeQuestion = 0;

userAnswers =
new Array(
activeExam.questions.length
).fill(null);


document
.getElementById("selectedExamTitle")
.innerText =

activeExam.icon
+
" "
+
activeExam.name;


document
.getElementById("selectedExamInfo")
.innerText =

activeExam.questions.length
+
" Questions • "
+
activeExam.time
+
" Minutes";


document
.getElementById("testScreen")
.style.display="block";


document
.getElementById("testStart")
.style.display="block";


document
.getElementById("questionArea")
.style.display="none";


document
.getElementById("testResult")
.style.display="none";


document
.getElementById("candidateInput")
.value="";


document
.getElementById("testScreen")
.scrollIntoView({
behavior:"smooth"
});

}


/* =========================================================
   START TEST
========================================================= */

function beginTest(){

let candidate =
document
.getElementById("candidateInput")
.value
.trim();


if(candidate===""){

alert(
"कृपया अपना नाम लिखें।"
);

return;

}


document
.getElementById("candidateDisplay")
.innerText =
"👤 " + candidate;


document
.getElementById("testStart")
.style.display="none";


document
.getElementById("questionArea")
.style.display="block";


remainingTime =
activeExam.time * 60;


createTestPalette();

showExamQuestion();

startExamTimer();

}


/* =========================================================
   SHOW QUESTION
========================================================= */

function showExamQuestion(){

let question =
activeExam.questions[
activeQuestion
];


document
.getElementById("questionNumber")
.innerText =

"Question "
+
(activeQuestion + 1)
+
" / "
+
activeExam.questions.length;


let html = `

<div class="question-no">

Question ${activeQuestion + 1}

</div>

<div class="question-text">

${question.q}

</div>

`;


question.o.forEach(
function(option,index){

let checked =

userAnswers[activeQuestion]
=== index

?

"checked"

:

"";


html += `

<label class="answer-option">

<input
type="radio"
name="mockAnswer"
${checked}

onchange="saveExamAnswer(${index})">

${String.fromCharCode(65+index)}.
${option}

</label>

`;

});


document
.getElementById("questionCard")
.innerHTML =
html;


let percentage =

(
(activeQuestion + 1)

/ activeExam.questions.length

) * 100;


document
.getElementById("testProgress")
.style.width =

percentage + "%";


let next =
document
.getElementById("nextExamButton");


if(
activeQuestion
===
activeExam.questions.length - 1
){

next.innerText =
"✓ Submit Test";

next.className =
"nav-test-btn final-submit";

}

else{

next.innerText =
"Next →";

next.className =
"nav-test-btn next-btn";

}


updateTestPalette();

}


/* =========================================================
   SAVE ANSWER
========================================================= */

function saveExamAnswer(index){

userAnswers[
activeQuestion
] = index;

updateTestPalette();

}


/* =========================================================
   NEXT
========================================================= */

function nextExamQuestion(){

if(
activeQuestion
<
activeExam.questions.length - 1
){

activeQuestion++;

showExamQuestion();

}

else{

if(
confirm(
"क्या आप Mock Test Submit करना चाहते हैं?"
)
){

finishExam();

}

}

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousExamQuestion(){

if(activeQuestion > 0){

activeQuestion--;

showExamQuestion();

}

}


/* =========================================================
   PALETTE
========================================================= */

function createTestPalette(){

let palette =
document
.getElementById("testPalette");

palette.innerHTML="";


activeExam.questions
.forEach(
function(question,index){

let button =
document.createElement("button");

button.className =
"palette-question";

button.innerText =
index + 1;

button.onclick =
function(){

activeQuestion=index;

showExamQuestion();

};

palette.appendChild(button);

});

}


function updateTestPalette(){

let buttons =
document
.querySelectorAll(".palette-question");


buttons.forEach(
function(button,index){

button.className =
"palette-question";


if(
userAnswers[index]
!== null
){

button.classList.add(
"done"
);

}


if(
index === activeQuestion
){

button.classList.add(
"current"
);

}

});

}


/* =========================================================
   TIMER
========================================================= */

function startExamTimer(){

clearInterval(
examTimerInterval
);


updateTimerDisplay();


examTimerInterval =

setInterval(
function(){

remainingTime--;

updateTimerDisplay();


if(
remainingTime <= 0
){

clearInterval(
examTimerInterval
);

alert(
"समय समाप्त हो गया। आपका Test Submit किया जा रहा है।"
);

finishExam();

}

},
1000
);

}


function updateTimerDisplay(){

let hours =
Math.floor(
remainingTime / 3600
);


let minutes =
Math.floor(
(remainingTime % 3600)
/ 60
);


let seconds =
remainingTime % 60;


let display="";


if(hours > 0){

display +=
String(hours)
.padStart(2,"0")
+
":";

}


display +=

String(minutes)
.padStart(2,"0")

+

":"

+

String(seconds)
.padStart(2,"0");


document
.getElementById("examTimer")
.innerText =
display;

}


/* =========================================================
   FINISH + RESULT
========================================================= */

function finishExam(){

clearInterval(
examTimerInterval
);


let correct=0;

let wrong=0;

let unanswered=0;


userAnswers.forEach(
function(answer,index){

if(answer === null){

unanswered++;

}

else if(
answer
===
activeExam.questions[index].a
){

correct++;

}

else{

wrong++;

}

});


let percentage =

Math.round(

(correct /
activeExam.questions.length)

* 100

);


document
.getElementById("questionArea")
.style.display="none";


document
.getElementById("testResult")
.style.display="block";


let candidate =

document
.getElementById("candidateInput")
.value;


document
.getElementById("resultCandidate")
.innerText =

"👤 "
+
candidate;


document
.getElementById("resultExam")
.innerText =

activeExam.name;


document
.getElementById("finalScore")
.innerText =

correct
+
"/"
+
activeExam.questions.length;


document
.getElementById("finalPercentage")
.innerText =

percentage
+
"%";


document
.getElementById("correctAnswers")
.innerText =
correct;


document
.getElementById("wrongAnswers")
.innerText =
wrong;


document
.getElementById("notAnswered")
.innerText =
unanswered;


document
.getElementById("totalQuestions")
.innerText =

activeExam.questions.length;


let message =
document
.getElementById("performanceMessage");


if(percentage >= 80){

message.innerText =
"🏆 Excellent Performance!";

}

else if(percentage >= 60){

message.innerText =
"🎯 Very Good Performance";

}

else if(percentage >= 40){

message.innerText =
"👍 Good — और Practice करें";

}

else{

message.innerText =
"📚 अधिक अभ्यास की जरूरत है";

}


createAnswerReview();

}


/* =========================================================
   ANSWER REVIEW
========================================================= */

function createAnswerReview(){

let html =

"<h3>📋 Answer Review</h3>";


activeExam.questions
.forEach(
function(question,index){

let given =
userAnswers[index];


let userAnswer =

given === null

?

"उत्तर नहीं दिया"

:

question.o[given];


let correctAnswer =

question.o[
question.a
];


html += `

<div class="review-question">

<strong>

Q${index+1}.
${question.q}

</strong>

<br>

आपका उत्तर:
${userAnswer}

<br>

<span style="color:#14833b;font-weight:bold">

✓ सही उत्तर:
${correctAnswer}

</span>

</div>

`;

});


document
.getElementById("answerReview")
.innerHTML =
html;

}


/* =========================================================
   RESTART
========================================================= */

function restartCurrentTest(){

activeQuestion=0;

userAnswers =
new Array(
activeExam.questions.length
).fill(null);


document
.getElementById("testResult")
.style.display="none";


document
.getElementById("testStart")
.style.display="block";

}


/* =========================================================
   CLOSE
========================================================= */

function closeTest(){

clearInterval(
examTimerInterval
);

document
.getElementById("testScreen")
.style.display="none";

}


/* =========================================================
   INITIAL LOAD
========================================================= */

document.addEventListener(
"DOMContentLoaded",
loadExamCards
);

</script>
